[paths]
output_dir = "outputs/f2"

[reconciliation]
exact_tolerance_eur = 0.005
documented_residual_eur = 1.0

# Every year with a reported close. Add the new year here when a workbook lands.
[periods]
start = 2024
end = 2028

# Which workbook wins when several restate the same year, most authoritative first.
[precedence]
"2024" = ["SRC-XLSX-003", "SRC-XLSX-002", "SRC-XLSX-001"]
"2025" = ["SRC-XLSX-003", "SRC-XLSX-002", "SRC-XLSX-001"]
"2026" = ["SRC-XLSX-003", "SRC-XLSX-002", "SRC-XLSX-001"]
"2027" = ["SRC-XLSX-003"]
"2028" = ["SRC-XLSX-004"]

# Source workbooks do not agree on sheet names. Roles are resolved through this
# map instead of renaming sheets in the original file, which stays immutable.
[sheet_aliases.SRC-XLSX-004]
"Hoja 1" = "valor de la compania"
"Hoja 2" = "indicadores clave"
"Hoja 3" = "marketing"
"Hoja 4" = "produccion"
"Hoja 5" = "logistica"
"Hoja 6" = "mercado"
"Hoja 7" = "ventas"
"Hoja 8" = "ingresos"
"Hoja 10" = "resultados"
"Hoja 11" = "balance"
